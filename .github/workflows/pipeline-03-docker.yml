name: Pipeline 03 - Docker


on:

  pull_request:
    branches:
      - main

jobs:
  construir-imagen:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        
      - name: Construir imagen Docker
        run: docker build -t laboratorio-php:v2 ./practica-03-docker

      - name: Probar contenedor Docker
        run: |
          resultado=$(docker run --rm laboratorio-php:v2)
          echo "$resultado"
          if [[ "$resultado" != "Esta es la version 2 de mi aplicacion PHP en Docker!" ]]; then
            echo "ERROR: El contenedor no devolvio el mensaje esperado"
            exit 1
          fi